{% extends 'base.html' %} {% block title %}Delete post · Inkwell{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 shadow-sm">
      <h2 class="mb-3">Delete this post?</h2>
      <p class="text-muted">
        "{{ post.title }}" and its comments will be permanently removed. This
        can't be undone.
      </p>
      <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete post</button>
        <a href="{{ post.get_absolute_url }}" class="btn btn-outline-secondary ms-2"
          >Cancel</a
        >
      </form>
    </div>
  </div>
</div>
{% endblock %}
