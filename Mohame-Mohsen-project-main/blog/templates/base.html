<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Inkwell{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
      }
      .navbar-brand {
        font-weight: 700;
      }
      .post-body {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">Inkwell</a>
        <div class="d-flex align-items-center gap-3">
          <a class="nav-link text-white-50" href="{% url 'home' %}">Home</a>
          {% if user.is_authenticated %}
          <a class="nav-link text-white-50" href="{% url 'add_post' %}"
            >Write a post</a
          >
          <span class="text-white-50 small">Signed in as {{ user.username }}</span>
          <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}"
            >Log out</a
          >
          {% else %}
          <a class="nav-link text-white-50" href="{% url 'login' %}">Log in</a>
          <a class="btn btn-primary btn-sm" href="{% url 'register' %}">Sign up</a>
          {% endif %}
        </div>
      </div>
    </nav>
    <div class="container pb-5">
      {% if messages %} {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %} {% endif %} {% block content %}{% endblock %}
    </div>
  </body>
</html>
