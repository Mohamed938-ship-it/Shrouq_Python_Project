{% extends 'base.html' %} {% block title %}Write a post · Inkwell{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card p-4 shadow-sm">
      <h2 class="mb-4">Write a new post</h2>
      <form method="POST">
        {% csrf_token %} {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }} {% for error in field.errors %}
          <div class="text-danger small mt-1">{{ error }}</div>
          {% endfor %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-success mt-2">Publish post</button>
        <a href="{% url 'home' %}" class="btn btn-outline-secondary mt-2 ms-2"
          >Cancel</a
        >
      </form>
    </div>
  </div>
</div>
{% endblock %}
